<!-- Consent Revocation Footer Link — GDPR Art.7(3) -->
<footer style="display:flex;align-items:center;justify-content:space-between;
               padding:16px 24px;border-top:1px solid #e5e7eb;
               font-family:system-ui,sans-serif">
  <span style="font-size:13px;color:#6b7280">© 2026 YourSite</span>
  <button onclick="reopenConsentBanner()"
          aria-label="Открыть настройки cookie"
          style="background:none;border:1px solid #d1d5db;color:#6b7280;
                 padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer">
    Настройки Cookie
  </button>
</footer>
<script>
function reopenConsentBanner() {
  localStorage.removeItem('uu_consent');
  const banner = document.getElementById('cookie-banner');
  if (banner) { banner.style.display = 'flex'; banner.focus(); }
}
</script>
