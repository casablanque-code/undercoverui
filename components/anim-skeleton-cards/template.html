<!-- Skeleton Loading: Cards -->
<style>
@keyframes skeleton-shimmer {
  0%   { background-position: -300px 0; }
  100% { background-position: 300px 0; }
}
.skeleton {
  background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
  background-size: 600px 100%;
  animation: skeleton-shimmer 1.4s ease-in-out infinite;
  border-radius: 6px;
}
@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; background: #e5e7eb; }
}
</style>

<div role="status" aria-busy="true" aria-label="Загрузка содержимого"
     style="border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;width:280px">

    <div style="display:flex;justify-content:space-between;margin-top:4px">

  </div>
</div>

<script>
function doneLoading(el) {
  el.removeAttribute('aria-busy');
