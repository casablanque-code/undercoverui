<!-- Network Offline Banner -->
<div id="offline-banner" hidden role="alert" aria-live="assertive"
     style="position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;
            padding:8px 16px;font-size:14px;display:flex;
            align-items:center;justify-content:space-between;z-index:9999;
            font-family:system-ui,sans-serif">
  <span>Нет подключения к интернету</span>
  <span id="offline-status" style="font-size:12px;opacity:0.8">Проверяем...</span>
</div>
<script>
let checkInterval;
function showOfflineBanner() {
  document.getElementById('offline-banner').hidden = false;
  checkInterval = setInterval(checkConnection, 3000);
}
function hideOfflineBanner() {
  document.getElementById('offline-banner').hidden = true;
  clearInterval(checkInterval);
}
async function checkConnection() {
  try {
    await fetch('/favicon.ico', { cache:'no-cache', signal:AbortSignal.timeout(3000) });
    hideOfflineBanner();
  } catch {
    document.getElementById('offline-status').textContent = 'Нет связи';
  }
}
window.addEventListener('offline', showOfflineBanner);
window.addEventListener('online', checkConnection);
</script>
