<!-- Terms Update Notification Modal -->
<div id="terms-modal" role="dialog" aria-modal="true"
     aria-labelledby="terms-title"
     style="position:fixed;inset:0;background:rgba(0,0,0,0.5);
            display:flex;align-items:center;justify-content:center;
            z-index:9999;padding:16px;font-family:system-ui,sans-serif">
  <div style="background:#fff;border-radius:12px;padding:24px;max-width:440px;width:100%">
    <h2 id="terms-title" style="margin:0 0 8px;font-size:18px">Мы обновили условия</h2>
    <p style="font-size:14px;color:#374151;line-height:1.5;margin:0 0 20px">
      С <strong>01.07.2026</strong> вступают в силу обновлённые условия использования.
      Изменения касаются п. 3.2 и п. 5.1.
    </p>
    <div style="display:flex;gap:8px">
      <a href="/terms" target="_blank"
         style="flex:1;background:#f3f4f6;border:1px solid #d1d5db;color:#374151;
                padding:9px;border-radius:6px;font-size:14px;text-align:center;text-decoration:none">
        Читать условия
      </a>
      <button onclick="acceptTerms()"
              style="flex:1;background:#4f46e5;border:none;color:#fff;
                     padding:9px;border-radius:6px;font-size:14px;cursor:pointer">
        Принять и продолжить
      </button>
    </div>
  </div>
</div>
<script>
const TERMS_VERSION = '2.1.0';
function acceptTerms() {
  localStorage.setItem('terms_accepted', JSON.stringify({ version: TERMS_VERSION, timestamp: Date.now() }));
  document.getElementById('terms-modal').style.display = 'none';
}
(function() {
  const saved = JSON.parse(localStorage.getItem('terms_accepted') || 'null');
  if (saved?.version === TERMS_VERSION) document.getElementById('terms-modal').style.display = 'none';
})();
</script>
