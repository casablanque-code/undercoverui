<!-- Cookie Banner: Classic -->
<!-- GDPR: opt-in до скриптов | CCPA: opt-out | Симметричные кнопки -->
<div id="cookie-banner" role="dialog" aria-modal="true"
     aria-label="Настройки конфиденциальности"
     style="position:fixed;bottom:0;left:0;right:0;background:#fff;
            border-top:2px solid #e5e7eb;padding:16px 24px;
            font-family:system-ui,sans-serif;z-index:9999;
            display:flex;align-items:center;justify-content:space-between;gap:16px">
  <p style="margin:0;font-size:14px;color:#374151;max-width:600px">
    Мы используем куки для аналитики и персонализации.
    <a href="/privacy" style="color:#4f46e5">Политика конфиденциальности</a>
  </p>
  <div style="display:flex;gap:8px;flex-shrink:0">
    <button onclick="cookieReject()" aria-label="Отклонить все куки"
            style="background:#f3f4f6;border:1px solid #d1d5db;
                   color:#374151;padding:8px 16px;border-radius:6px;
                   font-size:14px;cursor:pointer">
      Отклонить
    </button>
    <button onclick="cookieAccept()" aria-label="Принять все куки"
            style="background:#4f46e5;border:none;color:#fff;
                   padding:8px 16px;border-radius:6px;
                   font-size:14px;cursor:pointer">
      Принять
    </button>
  </div>
</div>
<script>
const CONSENT_KEY = 'uu_consent';
const CONSENT_VERSION = '1.0';
function cookieAccept() {
  saveConsent({ analytics: true, marketing: false });
  hideBanner();
  loadAnalytics();
}
function cookieReject() {
  saveConsent({ analytics: false, marketing: false });
  hideBanner();
}
function saveConsent(categories) {
  localStorage.setItem(CONSENT_KEY, JSON.stringify({
    version: CONSENT_VERSION, timestamp: Date.now(), categories
  }));
}
function hideBanner() {
  document.getElementById('cookie-banner').style.display = 'none';
}
function loadAnalytics() {
  // Загружайте скрипты аналитики только здесь
  // const s = document.createElement('script');
  // s.src = 'https://www.googletagmanager.com/gtag/js?id=GA_ID';
  // document.head.appendChild(s);
}
(function() {
  const saved = JSON.parse(localStorage.getItem(CONSENT_KEY) || 'null');
  if (saved?.version === CONSENT_VERSION) {
    document.getElementById('cookie-banner').style.display = 'none';
    if (saved.categories?.analytics) loadAnalytics();
  }
})();
</script>
