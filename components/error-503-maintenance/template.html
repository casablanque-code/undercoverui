<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Техническое обслуживание</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; display:flex;
           align-items:center; justify-content:center;
           min-height:100vh; background:#f9fafb; text-align:center; }
    h1 { font-size:22px; margin:0 0 8px; }
    p  { font-size:14px; color:#6b7280; margin:0 0 16px; }
    #countdown { font-family:monospace; font-size:36px; font-weight:700;
                 color:#4f46e5; letter-spacing:2px; margin-bottom:20px; }
  </style>
</head>
<body>
  <main>
    <h1>Ведутся технические работы</h1>
    <p>Мы обновляем сайт. Вернёмся совсем скоро.</p>
    <div id="countdown" aria-live="polite"></div>
    <p style="font-size:12px;color:#9ca3af">
      Вопросы? <a href="mailto:support@example.com">support@example.com</a>
    </p>
  </main>
  <script>
    const endTime = new Date(Date.now() + 3 * 60 * 60 * 1000);
    function updateTimer() {
      const diff = endTime - Date.now();
      if (diff <= 0) { location.reload(); return; }
      const h = String(Math.floor(diff / 3600000)).padStart(2, '0');
      const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
      const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
      document.getElementById('countdown').textContent = h + ':' + m + ':' + s;
    }
    updateTimer(); setInterval(updateTimer, 1000);
  </script>
</body>
</html>
