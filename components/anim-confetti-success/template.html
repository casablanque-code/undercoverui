<script>
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#4f46e5','#22c55e','#f59e0b','#ef4444','#8b5cf6'];
  const particles = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 3,
    d: Math.random() * 3 + 2,
    color: colors[Math.floor(Math.random() * 5)],
    tilt: 0, tiltAngle: 0,
    tiltAngleInc: Math.random() * 0.07 + 0.05,
  }));
  const start = Date.now();
  (function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(p.x + p.tilt, p.y, p.r, p.r * 0.4, p.tiltAngle, 0, Math.PI * 2);
      ctx.fill();
      p.y += p.d; p.tiltAngle += p.tiltAngleInc; p.tilt = Math.sin(p.tiltAngle) * 12;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
    });
    if (Date.now() - start < 4500) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  })();
}
</script>
